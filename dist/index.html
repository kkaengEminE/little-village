<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>작은 하루 · 숲속 생활</title><meta name="description" content="작은 주민이 되어 제초하고, 친구를 만나고, 자격증에 도전하는 생활 게임"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='10' fill='%233c5140'/%3E%3Cpath d='M16 26V12M16 20Q4 20 6 8Q17 8 16 20M16 15Q15 3 27 5Q27 16 16 15' fill='%23ebdfac'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css?v=3"></head><body>
<canvas id="world" aria-label="작은 하루 게임 필드. WASD 이동, E 상호작용, Space 조우, Shift 빠른 걸음" tabindex="0"></canvas>
<header class="top"><div class="brand"><span class="sprout">♧</span><div><strong>작은 하루</strong><small>숲속에서 살아가기</small></div></div><div class="day"><span id="sun">☀</span><div><b id="day">첫째 날</b><small id="time">오전 · 맑음</small></div></div><button id="sound" class="circle" aria-label="효과음 켜기">♪</button><button id="help" class="circle" aria-label="도움말">?</button></header>
<aside class="stats paper"><div><span>♥ 체력</span><b id="hpText">100 / 100</b></div><div class="meter"><i id="hpBar"></i></div><div><span>✦ 행동력</span><b id="energyText">100 / 100</b></div><div class="meter energy"><i id="energyBar"></i></div><footer><span>◉ <b id="coins">0</b> 코인</span><span id="rank">제초 무급</span></footer></aside>
<aside class="quest paper"><small>오늘의 작은 목표</small><h2 id="questTitle">첫 일감을 찾아서</h2><p id="questText">마을 가운데 접수처의 갑옷 씨와 이야기해 보세요.</p><div id="questProgress"></div><button id="guide">접수처 방향 보기</button></aside>
<div id="place" class="place">바람 부는 들판</div><div id="toast" role="status"></div><div id="prompt"></div>
<footer class="bottom"><div class="keyboard"><kbd>W A S D</kbd> / 바닥 클릭 이동 <kbd>E</kbd> 이야기 · 채집 <kbd>Space</kbd> 조우 <kbd>Shift</kbd> 빠른 걸음</div><nav class="toolbar paper"><button data-panel="bag"><span>▤</span>가방 <kbd>I</kbd></button><button data-panel="wardrobe"><span>♧</span>옷장 <kbd>C</kbd></button><button data-panel="book"><span>▥</span>교재 <kbd>B</kbd></button><button data-panel="map"><span>◇</span>지도 <kbd>M</kbd></button></nav><span class="save">이 브라우저에 자동 저장</span></footer>
<div id="touch"><div class="dpad"><button data-key="w">↑</button><button data-key="a">←</button><button data-key="s">↓</button><button data-key="d">→</button></div><div><button id="touchInteract">E · 행동</button><button id="touchAttack">조우</button><button id="touchDodge">빠른 걸음</button></div></div>
<section id="huntHud" hidden><button id="rescueButton" class="rescue-button">♧ 구조 헬리콥터 · 철수</button><div class="boss-hud paper"><b id="huntTitle"></b><span id="bossHp"></span><div class="meter"><i id="bossBar"></i></div><small id="partText"></small></div><details id="huntAdmin" class="paper"></details><div class="hunt-bottom paper"><b id="hunterVitals"></b><p id="huntNotice"></p><button id="huntEat">도시락 먹기 · F</button></div></section><dialog id="modal"><button id="close" class="close" aria-label="닫기">×</button><div id="content"></div></dialog>
<script src="hunt.js?v=3"></script><script src="battle.js?v=3"></script><script src="game.js?v=3"></script></body></html>
